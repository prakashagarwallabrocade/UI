[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookextract"
version = "0.1.0"
description = "Extract textbook PDFs into subject/chapter/exercise folders with HTML and text output"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.26",
    "typer>=0.12",
    "pyyaml>=6",
    "pydantic>=2.7",
    "python-slugify>=8",
    "jinja2>=3.1",
    "anthropic>=0.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bookextract = "bookextract.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookextract = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
